# 电满满 Docker Compose 配置
# 使用：docker compose up -d
# 访问：
#   - 管理后台：http://你的服务器IP/admin/
#   - API 文档：http://你的服务器IP/docs/

version: "3.8"

services:
  # ── FastAPI 后端 ──
  backend:
    build: ./backend_v2
    container_name: dianmanman-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      # JWT 密钥（生产环境请修改为随机值！）
      # 用 python -c "import secrets; print(secrets.token_hex(32))" 生成
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smart-charge-jwt-secret-change-in-production}
      - AMAP_KEY=${AMAP_KEY:-你的高德Key}
      - DATABASE_URL=sqlite:///./data/smart_charge.db
    volumes:
      # 持久化 SQLite 数据库（容器重启不丢数据）
      - ./backend_v2/data:/app/data
    networks:
      - app-network

  # ── Nginx 反向代理 + 静态文件 ──
  nginx:
    image: nginx:alpine
    container_name: dianmanman-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 数据大屏 + 管理后台（Vue 3 编译产物，通过 /dashboard/ 访问）
      - ./Dianmanman-dashboard/dist:/usr/share/nginx/html/dashboard:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
